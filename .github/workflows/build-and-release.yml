name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      create_release:
        description: 'Create a release'
        required: false
        default: false
        type: boolean

jobs:
  build:
    name: Build ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'macos'
            os: 'macos-latest'
            arch: 'universal'
          - platform: 'windows'
            os: 'windows-latest'
            arch: 'x64'
          - platform: 'linux'
            os: 'ubuntu-latest'
            arch: 'x64'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: 'npm'

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Install dependencies (Ubuntu only)
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Install frontend dependencies
        run: npm ci

      - name: Download binaries (macOS)
        if: matrix.platform == 'macos'
        run: |
          chmod +x ./download-binaries.sh
          ./download-binaries.sh

      - name: Download binaries (Windows)
        if: matrix.platform == 'windows'
        shell: powershell
        run: |
          Set-ExecutionPolicy -ExecutionPolicy RemoteSigned -Scope CurrentUser -Force
          .\download-binaries.ps1

      - name: Download binaries (Linux)
        if: matrix.platform == 'linux'
        run: |
          mkdir -p src-tauri/resources
          
          # Download yt-dlp for Linux
          echo "Downloading yt-dlp for Linux..."
          curl -L https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp -o src-tauri/resources/yt-dlp
          chmod +x src-tauri/resources/yt-dlp
          
          # Download ffmpeg for Linux
          echo "Downloading ffmpeg for Linux..."
          wget -q https://johnvansickle.com/ffmpeg/releases/ffmpeg-release-amd64-static.tar.xz -O /tmp/ffmpeg.tar.xz
          tar -xf /tmp/ffmpeg.tar.xz -C /tmp
          cp /tmp/ffmpeg-*-amd64-static/ffmpeg src-tauri/resources/ffmpeg
          chmod +x src-tauri/resources/ffmpeg
          
          # Download Whisper model
          echo "Downloading Whisper model..."
          curl -L https://huggingface.co/ggerganov/whisper.cpp/resolve/main/ggml-base.en.bin -o src-tauri/resources/ggml-base.en.bin
          
          echo "Note: whisper binary needs to be built from source or downloaded separately"
          echo "For CI purposes, we'll skip whisper binary for now"

      - name: Build frontend
        run: npm run build

      - name: Build Tauri application
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'Grably v${{ github.ref_name }}'
          releaseBody: |
            ## What's New
            
            ### Download the appropriate version for your platform:
            
            - **Windows**: `Grably_*_x64-setup.exe` (Installer) or `Grably_*_x64.msi` (MSI Package)
            - **macOS**: `Grably_*_universal.dmg` (Universal binary for Intel and Apple Silicon)
            - **Linux**: `Grably_*_amd64.AppImage` (AppImage) or `grably_*_amd64.deb` (Debian package)
            
            ### Installation Notes
            
            **Windows Users:**
            - Download and run the `.exe` installer
            - Windows Defender may show a warning - click "More info" then "Run anyway" (app is not code signed yet)
            
            **macOS Users:**
            - Download the `.dmg` file and drag Grably to Applications
            - You may need to right-click and select "Open" the first time due to Gatekeeper
            
            **Linux Users:**
            - For AppImage: Download, make executable (`chmod +x`), and run
            - For Debian: Install with `sudo dpkg -i grably_*_amd64.deb`
            
            ### Requirements
            
            All required binaries (yt-dlp, ffmpeg, whisper model) are bundled with the application.
            No additional downloads needed!
            
            ## Features
            
            - 🎥 Download videos from 1000+ websites
            - 🎙️ AI-powered transcription with Whisper
            - 🔒 100% offline processing
            - ⚡ Lightning-fast downloads
            - 🖥️ Native desktop application
            
            **Full changelog:** https://github.com/${{ github.repository }}/compare/v${{ github.event.inputs.previous_tag || 'HEAD~1' }}...${{ github.ref_name }}
          releaseDraft: false
          prerelease: ${{ contains(github.ref_name, 'beta') || contains(github.ref_name, 'alpha') || contains(github.ref_name, 'rc') }}
          includeUpdaterJson: true

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build-${{ matrix.platform }}-${{ matrix.arch }}
          path: |
            src-tauri/target/release/bundle/
            !src-tauri/target/release/bundle/**/deps/
          retention-days: 30

  # Job to create a manual release when workflow_dispatch is used
  create-manual-release:
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.create_release == 'true'
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: ./artifacts
          
      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v${{ github.run_number }}
          name: 'Grably Build ${{ github.run_number }}'
          body: |
            ## Development Build
            
            This is an automated build from the latest code.
            
            ### Downloads
            
            - **Windows**: Look for `*-setup.exe` or `*.msi` files
            - **macOS**: Look for `*.dmg` files  
            - **Linux**: Look for `*.AppImage` or `*.deb` files
            
            ### Installation
            
            Same as release versions - download the appropriate file for your platform and install.
            
            **Note**: This is a development build and may contain bugs.
          files: ./artifacts/**/*
          draft: false
          prerelease: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}